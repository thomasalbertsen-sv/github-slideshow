<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>M-Files Graphs</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
                background: #f5f6f8;
                color: #222;
            }
            header {
                padding: 16px 24px;
                background: #fff;
                border-bottom: 1px solid #e3e5e8;
            }
            header h1 {
                margin: 0;
                font-size: 18px;
                font-weight: 600;
            }
            #grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 16px;
                padding: 16px;
                height: calc(100% - 60px);
                box-sizing: border-box;
            }
            .panel {
                background: #fff;
                border: 1px solid #e3e5e8;
                border-radius: 6px;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
                min-height: 280px;
            }
            .panel.full {
                grid-column: 1 / -1;
            }
            @media (max-width: 900px) {
                #grid {
                    grid-template-columns: 1fr;
                    grid-auto-rows: 320px;
                }
                .panel.full {
                    grid-column: auto;
                }
            }
        </style>
    </head>
    <body>
        <header><h1>M-Files Graphs</h1></header>
        <div id="grid">
            <div id="chart-line" class="panel"></div>
            <div id="chart-bar" class="panel"></div>
            <div id="chart-pie" class="panel full"></div>
        </div>
        <script src="main.js"></script>
    </body>
</html>
